# =========================================================================
# HAND-WRITTEN workflow — NOT generated by `aisland jenkins scaffold`.
# (ci.yml / Jenkinsfile are generated; this release pipeline is separate so
# regeneration never clobbers it.)
#
# Publishes the `torpaido` distribution to PyPI when a version tag is pushed:
#
#   git tag v0.1.0a1 && git push origin v0.1.0a1
#
# Uses PyPI Trusted Publishing (OIDC, no stored API token). One-time setup on
# https://pypi.org/manage/account/publishing/ — add a "pending publisher":
#   PyPI project name: torpaido
#   Owner:             Gearlux
#   Repository:        torpaido
#   Workflow name:     release.yml
#   Environment:       pypi
#
# Publish ORDER: loggair -> confluid -> recordstream -> matrainer are on PyPI
# already, and this package declares floors on all four, so it publishes after
# them. The packages that declare a `torpaido` floor publish after THIS one.
# =========================================================================
name: Release to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install packaging toolchain
      run: python -m pip install build twine uv
    - name: Guard - tag matches pyproject version
      run: |
        PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Tag v$TAG_VERSION does not match pyproject version $PKG_VERSION"
          exit 1
        fi
    - name: Build sdist + wheel
      run: python -m build
    - name: Check package metadata
      run: python -m twine check --strict dist/*
    - name: Smoke-test the built wheel in a clean venv
      # Runs from /tmp: with the repo root as cwd, `import torpaido` would find
      # the SOURCE tree (cwd shadows site-packages) and silently test the repo
      # instead of the wheel — the repo directory and the package share a name.
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install --quiet dist/*.whl
        cd /tmp
        /tmp/smoke/bin/python - <<'EOF'
        import os
        import sys
        from importlib.metadata import entry_points, version
        from pathlib import Path

        import torpaido
        from torpaido import Graph, graph_from_steps

        # The core install carries no framework: the IR, the front end and the dataflow pass need none, and
        # the lowering language and the backends sit behind [torch] / [onnx]. An import that drags one in
        # is a release bug.
        heavy = [m for m in ("torch", "onnx", "onnxruntime", "onnxscript") if m in sys.modules]
        assert not heavy, f"`import torpaido` imported {heavy}"

        # The compiler, the op and the backends are found through the entry point a discovery service
        # reads; an install whose metadata lacks one lists nothing.
        listed = {ep.value for ep in entry_points(group="confluid.configurables")}
        missing = [m for m in ("torpaido.compile", "torpaido.compiled", "torpaido.backends") if m not in listed]
        assert not missing, f"entry points missing: {missing}"

        # The YAML configs travel as wheel data, where a `pkg://torpaido/<path>` include finds them.
        example = Path(sys.prefix) / "share" / "torpaido" / "config" / "compile.example.yaml"
        assert example.is_file(), f"{example} is not in the wheel"

        # `__version__` is the RELEASED number: read from the wheel's own metadata, which the tag guard
        # above matched to pyproject.toml.
        tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
        assert torpaido.__version__ == version("torpaido") == tag, (torpaido.__version__, version("torpaido"), tag)
        print("wheel smoke-test OK, version:", version("torpaido"))
        EOF
    - name: Every extra resolves from PyPI
      # `pip install torpaido[<extra>]` is what a user types, and nothing above installs
      # an extra. An extra naming a package that is not on PyPI builds, uploads and
      # smoke-tests cleanly, then fails for every user who asks for it.
      # Resolution only (--dry-run): no framework is downloaded or installed.
      run: |
        WHEEL=$(ls dist/*.whl)
        EXTRAS=$(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']))")
        for extra in $EXTRAS; do
          echo "::group::torpaido[$extra]"
          uv pip install --dry-run --python /tmp/smoke/bin/python "$WHEEL[$extra]"
          echo "::endgroup::"
        done
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
